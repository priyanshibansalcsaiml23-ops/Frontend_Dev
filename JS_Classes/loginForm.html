<!-- loginForm.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
    <style>
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username"><br>
        <input type="password" id="password" placeholder="Password"><br>
        <button type="submit">Login</button>
    </form>
    <p id="message"></p>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // Regex patterns
            const usernamePattern = /^.{5,}$/; // at least 5 characters
            const passwordPattern = /^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*]).{8,}$/;

            if (!usernamePattern.test(username)) {
                message.textContent = "Error: Username must be at least 5 characters.";
                message.className = "error";
            } else if (!passwordPattern.test(password)) {
                message.textContent = "Error: Password must be at least 8 characters and include uppercase, lowercase, number, and special character.";
                message.className = "error";
            } else {
                message.textContent = "Login Successful!";
                message.className = "success";
            }
        });
    </script>
</body>
</html>
