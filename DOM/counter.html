<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Character Counter</title>
  <style>
    #counter { font-weight: bold; margin-top: 8px; }
    .warn { color: orange; }
    .danger { color: red; }
  </style>
</head>
<body>
  <h2>Live Character Counter</h2>
  <textarea id="textArea" rows="5" cols="50" placeholder="Type here..."></textarea>
  <div id="counter">Remaining: 100</div>
  <button id="resetBtn">Reset</button>
  <script src="counters.js"></script>
</body>
</html>
